services:
  - type: web
    name: xsigner
    runtime: docker
    region: ohio
    plan: standard
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: xsigner-work
      mountPath: /data
      sizeGB: 40
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: ZSIGN_BIN
        value: /usr/local/bin/zsign
      - key: ZSIGN_ZIP_LEVEL
        value: "1"
      - key: MAX_IPA_BYTES
        value: "4294967296"
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: API_SIGN_RATE_LIMIT
        value: "30"
      - key: API_CLIENT_DEFAULT_LIMIT
        value: "120"
      - key: API_CLIENT_DEFAULT_WINDOW_MS
        value: "900000"
      - key: API_SIGN_AUTHENTICATED_IP_LIMIT
        value: "300"
      - key: PART_SIZE_BYTES
        value: "16777216"
      - key: TIGRIS_UPLOAD_QUEUE_SIZE
        value: "4"
      - key: TIGRIS_OBJECT_TRANSFER_CONCURRENCY
        value: "2"
      - key: TIGRIS_PARALLEL_DOWNLOAD_THRESHOLD_BYTES
        value: "67108864"
      - key: TIGRIS_DOWNLOAD_CHUNK_SIZE_BYTES
        value: "33554432"
      - key: TIGRIS_DOWNLOAD_CONCURRENCY
        value: "4"
      - key: JOB_TTL_HOURS
        value: "24"
      - key: UPLOAD_TTL_HOURS
        value: "6"
      - key: SIGN_TIMEOUT_MS
        value: "3600000"
      - key: REMOTE_FETCH_TIMEOUT_MS
        value: "3600000"
      - key: PUBLIC_ORIGIN
        value: https://xsigner.onrender.com
      - key: OWNER_IP
        value: 168.91.23.165
      - key: AWS_ENDPOINT_URL_S3
        value: https://t3.storage.dev
      - key: AWS_ENDPOINT_URL_IAM
        value: https://iam.storage.dev
      - key: AWS_REGION
        value: auto
      - key: S3_BUCKET
        value: xsigner
      - key: MANIFEST_STORAGE
        value: local
      - key: S3_MAINTENANCE_INTERVAL_MS
        value: "3600000"
      - key: SIGNED_IPA_TTL_MINUTES
        value: "10"
      - key: SIGNED_IPA_CLEANUP_INTERVAL_MS
        value: "10000"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: JOB_ENCRYPTION_KEY
        generateValue: true
