services:
  - type: web
    name: xsigner
    runtime: docker
    region: ohio
    plan: standard
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: xsigner-work
      mountPath: /data
      sizeGB: 40
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: ZSIGN_BIN
        value: /usr/local/bin/zsign
      - key: MAX_IPA_BYTES
        value: "4294967296"
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: PART_SIZE_BYTES
        value: "67108864"
      - key: JOB_TTL_HOURS
        value: "24"
      - key: UPLOAD_TTL_HOURS
        value: "6"
      - key: SIGN_TIMEOUT_MS
        value: "2700000"
      - key: PUBLIC_ORIGIN
        value: https://xsigner.onrender.com
      - key: AWS_ENDPOINT_URL_S3
        value: https://t3.storage.dev
      - key: AWS_ENDPOINT_URL_IAM
        value: https://iam.storage.dev
      - key: AWS_REGION
        value: auto
      - key: S3_BUCKET
        value: xsigner
      - key: MANIFEST_STORAGE
        value: local
      - key: S3_MAINTENANCE_INTERVAL_MS
        value: "3600000"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: JOB_ENCRYPTION_KEY
        generateValue: true
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: RECAPTCHA_ALLOWED_HOSTNAMES
        value: xsigner.onrender.com
